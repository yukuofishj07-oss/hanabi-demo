<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>花火島 HANABI ISLAND - 微縮模型工藝與夜空盛典</title>
  <link rel="stylesheet" href="./styles/main.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- 左上品牌與說明 -->
  <div class="glass-panel" id="brand-card">
    <div class="eyebrow">HANABI WORKSHOP & FESTIVAL</div>
    <h1>花火島 ． 示範工藝城</h1>
    <p>12 座六角島嶼串聯：火藥純化、光譜配色、星體造粒、紙帶緊紮到海角砲陣連射！</p>
    <div class="badge-row">
      <span class="chip">🎆 即時物理花火</span>
      <span class="chip">👷 黏土工匠搬運</span>
      <span class="chip">🌊 柔光海浪波紋</span>
    </div>
  </div>

  <!-- 右上工藝即時日誌 -->
  <div class="glass-panel" id="live-log-panel">
    <div class="log-header">
      <span class="live-dot"></span>
      <span class="eyebrow" style="margin:0;">FACTORY LIVE LOG</span>
    </div>
    <div id="log-list">
      <div class="log-item">🟢 01所：高純度松木炭裝箱待運</div>
      <div class="log-item">🚚 輸送線：紅色鍶鹽正流向 03造粒廠</div>
      <div class="log-item">✨ 11島：10 吋尺玉錦冠彈填裝完畢</div>
    </div>
  </div>

  <!-- 底部 HUD 工具列 -->
  <div class="glass-panel" id="hud-toolbar">
    <div class="hud-group">
      <button class="hud-btn" data-time="360">🌅 清晨</button>
      <button class="hud-btn" data-time="720">☀️ 正午</button>
      <button class="hud-btn" data-time="1065">🌇 霞暮</button>
      <button class="hud-btn active" data-time="1260">🎆 盛典夜</button>
    </div>
    <div class="hud-divider"></div>
    <div class="hud-group">
      <button class="hud-btn toggle-btn active" id="toggle-flow">⚡ 輸送流光</button>
      <button class="hud-btn toggle-btn active" id="toggle-workers">👷 工匠活動</button>
      <button class="hud-btn" id="btn-topdown">🔭 鳥瞰/斜角</button>
      <button class="hud-btn fire-action" id="btn-launch-firework">🎇 立即發射！</button>
      <button class="hud-btn fire-action-combo" id="btn-launch-barrage">🎆 萬彈齊發</button>
    </div>
  </div>

  <!-- 左側詳細資訊卡片 -->
  <div class="glass-panel" id="detail-card">
    <div class="card-close" id="card-close-btn">&times;</div>
    <div class="eyebrow" id="card-type">工序島嶼</div>
    <h2 id="card-title">點選島嶼或建築查看</h2>
    <div id="card-desc">在 3D 微縮地圖中選擇六角工坊或工序細項。</div>
    <div class="stats-grid" id="card-stats"></div>
    <button class="card-action-btn" id="card-fire-btn">💥 從此島發射專屬試驗煙火</button>
  </div>

  <!-- 載入層 -->
  <div id="loading-overlay">
    <div class="loader-content">
      <div class="loader-spinner"></div>
      <h2>花火島 微縮工藝世界組裝中...</h2>
      <p>正在烘烤黏土島嶼、編織動態流光管線與計算花火彈道</p>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
