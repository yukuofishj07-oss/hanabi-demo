<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>花火工坊島 Hanabi Craft Island - 3D 黏土微縮展示</title>
  <style>
    :root {
      --coral: #db6a41;
      --coral-dark: #b84f28;
      --ink: #1f1b1b;
      --cream: #fff9f5;
      --yellow: #fde883;
      --gold: #f5a623;
      --stone: #c5b5a7;
      --slate: #4a5568;
      --border-glass: rgba(255, 255, 255, 0.85);
      --bg-glass: rgba(255, 249, 245, 0.88);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at 50% 50%, #fffdf9 0%, #ecdccf 100%);
      color: var(--ink);
    }
    #webgl-canvas, #css-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    #webgl-canvas { z-index: 1; }
    #css-canvas { pointer-events: none; z-index: 2; }

    /* UI 根佈局 */
    .ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10; pointer-events: none; display: flex; flex-direction: column;
      justify-content: space-between; padding: 20px;
    }

    /* 頂部品牌卡 */
    .brand-card {
      pointer-events: auto; background: var(--bg-glass);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass); padding: 12px 20px;
      border-radius: 18px; width: fit-content;
      box-shadow: 0 10px 30px rgba(74, 42, 20, 0.08);
    }
    .brand-eyebrow {
      font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700;
      color: var(--coral); letter-spacing: 2px; text-transform: uppercase;
    }
    .brand-title {
      font-size: 18px; font-weight: 800; color: var(--ink);
      display: flex; align-items: center; gap: 8px; margin-top: 2px;
    }
    .brand-tag {
      font-size: 11px; font-weight: 700; background: var(--coral);
      color: #fff; padding: 2px 8px; border-radius: 999px;
    }

    /* 左側詳細卡片 */
    .info-panel {
      pointer-events: auto; position: absolute; top: 96px; left: 20px;
      width: 330px; max-height: calc(100vh - 200px); overflow-y: auto;
      background: var(--bg-glass); backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px); border: 1px solid var(--border-glass);
      border-radius: 20px; padding: 18px;
      box-shadow: 0 12px 36px rgba(74, 42, 20, 0.12);
      transform: translateX(0); transition: all 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .info-panel.hidden { transform: translateX(-390px); opacity: 0; pointer-events: none; }
    .info-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .info-badge { font-size: 11px; font-weight: 700; background: var(--yellow); color: var(--ink); padding: 3px 8px; border-radius: 6px; }
    .info-close { cursor: pointer; border: none; background: transparent; font-size: 20px; color: var(--slate); font-weight: 700; }
    .info-title { font-size: 17px; font-weight: 800; color: var(--ink); margin-bottom: 6px; }
    .info-desc { font-size: 13px; color: #5a4b41; line-height: 1.5; margin-bottom: 12px; }
    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .metric-box { background: rgba(255, 255, 255, 0.7); padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.04); }
    .metric-label { font-size: 10px; color: #8c786c; font-weight: 600; }
    .metric-value { font-size: 15px; font-weight: 800; color: var(--coral); font-family: Georgia, serif; }
    .aesthetics-tag-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .aes-tag { font-size: 11px; font-weight: 700; background: #fff; border: 1px solid rgba(219, 106, 65, 0.3); color: var(--coral); padding: 3px 8px; border-radius: 999px; }

    /* 右側清單側欄 */
    .sidebar {
      pointer-events: auto; position: absolute; top: 20px; right: 20px;
      width: 300px; max-height: calc(100vh - 120px); display: flex; flex-direction: column;
      background: var(--bg-glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-glass); border-radius: 20px; padding: 14px;
      box-shadow: 0 10px 30px rgba(74, 42, 20, 0.08); transition: transform 0.3s ease;
    }
    .sidebar-search {
      width: 100%; padding: 8px 12px; border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.08); background: #fff; font-size: 12px;
      outline: none; margin-bottom: 10px;
    }
    .sidebar-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .sidebar-tab {
      flex: 1; padding: 6px; border: none; background: rgba(0,0,0,0.04);
      border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; color: var(--slate);
    }
    .sidebar-tab.active { background: var(--coral); color: #fff; }
    .sidebar-content { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
    .sidebar-item {
      padding: 8px 10px; background: rgba(255, 255, 255, 0.75); border-radius: 10px;
      font-size: 12px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between;
      border: 1px solid rgba(0,0,0,0.03); transition: 0.2s;
    }
    .sidebar-item:hover { background: var(--yellow); }
    .sidebar-item.active { background: var(--ink); color: #fff; }

    /* 右上運行日誌面板 */
    .live-log {
      position: absolute; top: 20px; right: 335px; width: 220px;
      background: rgba(31, 27, 27, 0.88); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 14px;
      padding: 10px 14px; color: #fff; font-size: 11px; pointer-events: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .live-log-header { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--yellow); margin-bottom: 6px; }
    .live-dot { width: 7px; height: 7px; background: #2ecc71; border-radius: 50%; box-shadow: 0 0 6px #2ecc71; animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    .log-stream { max-height: 60px; overflow: hidden; display: flex; flex-direction: column; gap: 4px; font-family: ui-monospace, monospace; }

    /* 底部 HUD */
    .bottom-hud {
      pointer-events: auto; align-self: center; display: flex; align-items: center;
      gap: 8px; background: var(--bg-glass); backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border-glass);
      padding: 6px 14px; border-radius: 999px;
      box-shadow: 0 10px 30px rgba(74, 42, 20, 0.12); flex-wrap: wrap; justify-content: center;
    }
    .time-badge { font-family: ui-monospace, monospace; font-weight: 700; font-size: 13px; color: var(--ink); padding: 4px 8px; background: rgba(219, 106, 65, 0.12); border-radius: 6px; }
    .hud-btn {
      min-height: 36px; padding: 4px 12px; border-radius: 999px; border: none;
      background: #fff; color: var(--ink); font-size: 11px; font-weight: 700;
      cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.06); transition: all 0.2s ease;
      display: flex; align-items: center; gap: 4px;
    }
    .hud-btn:hover { background: var(--yellow); transform: translateY(-1px); }
    .hud-btn.active { background: var(--coral); color: #fff; }
    .hud-btn.fire-btn {
      background: linear-gradient(135deg, #e65627 0%, #db6a41 100%);
      color: #fff; box-shadow: 0 4px 12px rgba(219, 106, 65, 0.4);
    }
    .hud-btn.fire-btn:hover { transform: translateY(-2px) scale(1.04); }

    /* CSS2D 膠囊標籤 */
    .island-pill {
      pointer-events: auto; cursor: pointer; background: rgba(255, 249, 245, 0.95);
      border: 1px solid rgba(219, 106, 65, 0.35); padding: 5px 12px;
      border-radius: 999px; font-size: 11px; font-weight: 800; color: var(--ink);
      white-space: nowrap; box-shadow: 0 4px 12px rgba(74, 42, 20, 0.15);
      transform: translate(-50%, -50%); transition: all 0.2s cubic-bezier(0.2, 0.8, 0.4, 1);
    }
    .island-pill:hover { background: var(--yellow); border-color: var(--coral); transform: translate(-50%, -60%) scale(1.08); }
    .island-pill.selected { background: var(--ink); color: #fff; border-color: var(--yellow); transform: translate(-50%, -50%) scale(1.12); }

    #fire-tip {
      position: absolute; bottom: 74px; left: 50%; transform: translateX(-50%);
      background: rgba(31, 27, 27, 0.88); color: #fff; padding: 6px 18px;
      border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: 1px;
      pointer-events: none; opacity: 0; transition: opacity 0.3s ease; z-index: 15;
    }

    #error-modal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      z-index: 1000; display: none; max-width: 400px; text-align: center;
    }

    /* 手機版自適應 */
    @media (max-width: 800px) {
      .ui-layer { padding: 12px; }
      .sidebar { display: none; }
      .live-log { display: none; }
      .info-panel {
        top: auto; bottom: 70px; left: 12px; right: 12px; width: auto;
        max-height: 45vh; border-radius: 16px;
      }
      .info-panel.hidden { transform: translateY(120%); }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="error-modal">
    <h3 style="color:var(--coral);margin-bottom:8px;">環境載入提示</h3>
    <p id="error-msg" style="font-size:13px;color:#666;">WebGL 初始化失敗，請檢查瀏覽器設定。</p>
  </div>

  <div class="ui-layer">
    <!-- 頂部品牌卡 -->
    <div class="brand-card">
      <div class="brand-eyebrow">Hanabi Craft Island 3D</div>
      <div class="brand-title">花火工坊島 <span class="brand-tag">製造到施放全解構</span></div>
    </div>

    <!-- 右上運行即時動態 -->
    <div class="live-log">
      <div class="live-log-header"><span class="live-dot"></span> 工坊即時日誌 (LIVE)</div>
      <div class="log-stream" id="log-stream">
        <div>[06:00] 化料檢驗合格完成</div>
        <div>[10:15] 菊先色星第三層滾製中</div>
      </div>
    </div>

    <!-- 左側詳細工藝面板 -->
    <div class="info-panel" id="info-panel">
      <div class="info-header">
        <span class="info-badge" id="info-stage">工序 06</span>
        <button class="info-close" id="btn-close-info">&times;</button>
      </div>
      <div class="info-title" id="info-title">組裝填星對合</div>
      <div class="info-desc" id="info-desc">將同心圓菊先變色星體排列於半球玉皮內，中心充填棉籽割藥，完成和紙玉掛與力線捆紮。</div>
      <div class="metrics-grid">
        <div class="metric-box">
          <div class="metric-label" id="m1-label">星體配置</div>
          <div class="metric-value" id="m1-val">3 重芯</div>
        </div>
        <div class="metric-box">
          <div class="metric-label" id="m2-label">玉掛糊貼</div>
          <div class="metric-value" id="m2-val">24 層和紙</div>
        </div>
      </div>
      <div style="font-size: 11px; font-weight: 700; color: #8c786c; margin-bottom: 4px;">美學鑑賞要素：</div>
      <div class="aesthetics-tag-row" id="aes-tags">
        <span class="aes-tag">型 - 圓度真球</span>
        <span class="aes-tag">流 - 昇曲導火</span>
      </div>
    </div>

    <!-- 右側清單側欄 -->
    <div class="sidebar" id="sidebar">
      <input type="text" class="sidebar-search" id="sidebar-search" placeholder="搜尋工藝階段、設備或原料...">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" id="tab-islands">12 工藝島</button>
        <button class="sidebar-tab" id="tab-lines">物流輸送線</button>
      </div>
      <div class="sidebar-content" id="sidebar-list"></div>
    </div>

    <div id="fire-tip">點擊砲台或發射按鈕，夜空將升起尺玉並綻放變色火光！</div>

    <!-- 底部 HUD 工具列 -->
    <div class="bottom-hud">
      <div class="time-badge" id="hud-clock">12:00</div>
      <button class="hud-btn" data-time="360">06 晨混</button>
      <button class="hud-btn active" data-time="720">12 日正</button>
      <button class="hud-btn" data-time="1080">18 暮霞</button>
      <button class="hud-btn" data-time="1260">21 試射</button>
      <div style="width: 1px; height: 16px; background: rgba(0,0,0,0.1); margin: 0 2px;"></div>
      <button class="hud-btn" id="btn-toggle-flow">管線</button>
      <button class="hud-btn" id="btn-toggle-cam">鳥瞰</button>
      <button class="hud-btn fire-btn" id="btn-fire">🎇 施放尺玉</button>
      <button class="hud-btn" id="btn-reset">全景</button>
    </div>
  </div>

  <div id="css-canvas"></div>
  <canvas id="webgl-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // 0. 固定種子亂數
    function mulberry32(a) {
      return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    const rng = mulberry32(20261023);

    // 1. DATA 驅動配置 (12 道煙火工藝、物流輸送線與日夜時程)
    const DATA = {
      islands: [
        { id: "chem", name: "01 原料化學", q: 0, r: 0, theme: "#db6a41", stage: "工序 01", title: "原料配製與化學調合", desc: "精細調配高氯酸鉀氧化劑、鋁鎂可燃劑與發色金屬鹽（鍶紅、鋇綠、銅藍）。", m1_lbl: "純度標準", m1_val: "99.4 %", m2_lbl: "粒徑篩網", m2_val: "200 目", tags: ["雅 - 焰色純正", "流 - 穩定燃燒"] },
        { id: "star", name: "02 造粒成星", q: 1, r: -1, theme: "#e2865e", stage: "工序 02", title: "斜筒滾星造粒機台", desc: "油菜籽或微粒蕊心在斜筒中滾動，反覆噴霧水並裹附變色藥粉，長成直徑均勻的星體。", m1_lbl: "單粒直徑", m1_val: "8.5 mm", m2_lbl: "變色層數", m2_val: "3 段轉色", tags: ["型 - 真球對稱", "雅 - 變色層次"] },
        { id: "charge", name: "03 割藥調合", q: 2, r: -1, theme: "#a34e34", stage: "工序 03", title: "棉籽割藥配附工作亭", desc: "以棉籽或炭粒為骨架，緊密裹附高感度黑火藥，作為空中炸碎球殼並點燃星體的核心割藥。", m1_lbl: "爆速系數", m1_val: "420 m/s", m2_lbl: "中心裝藥比", m2_val: "45 %", tags: ["魄 - 瞬時激爆", "流 - 均勻擴散"] },
        { id: "shell", name: "04 半球玉皮", q: 0, r: 1, theme: "#b48560", stage: "工序 04", title: "和紙半球液壓成型機", desc: "高級和紙與牛皮紙在球形金屬陰陽模具下多層壓制定型，提供星體排列的堅韌外殼。", m1_lbl: "耐壓極限", m1_val: "32 MPa", m2_lbl: "成型壁厚", m2_val: "3.2 mm", tags: ["型 - 堅實包覆"] },
        { id: "fuse", name: "05 導火引線", q: -1, r: 1, theme: "#728f5f", stage: "工序 05", title: "引信揉搓與割火定時", desc: "棉線浸潤微黑藥揉成定時火繩，精密計算延遲燃燒時間，使球彈恰在最高點破空炸開。", m1_lbl: "燃燒時差", m1_val: "4.2 秒", m2_lbl: "誤差範圍", m2_val: "± 0.05 s", tags: ["流 - 行雲流水", "雅 - 準時綻放"] },
        { id: "pack", name: "06 組裝填星", q: 1, r: 0, theme: "#d97843", stage: "工序 06", title: "同心圓裝藥與尺玉剖面", desc: "在半球殼內鋪設菊先星、內芯星，中心灌入割藥並合球，展示完美的內部幾何構造。", m1_lbl: "星體總量", m1_val: "480 顆", m2_lbl: "同心圓芯", m2_val: "雙重芯球", tags: ["型 - 真球幾何", "情 - 內心感動"] },
        { id: "pasting", name: "07 糊貼玉掛", q: 2, r: 0, theme: "#c86036", stage: "工序 07", title: "千層玉掛糊貼與麻繩力線", desc: "合球後反覆糊貼數十層牛皮紙，並以麻繩縱橫交錯捆紮（力線），強化球壁耐壓度。", m1_lbl: "糊貼層數", m1_val: "36 層", m2_lbl: "捆紮道數", m2_val: "48 道力線", tags: ["魄 - 能量積蓄", "型 - 均等碎裂"] },
        { id: "dry", name: "08 階梯風乾", q: 0, r: 2, theme: "#5a8c9e", stage: "工序 08", title: "通風乾燥棚與溫濕控管", desc: "在階梯棚架進行 72 小時循環通風與日照風乾，含水率降至 1.2% 以下，避免殘渣。", m1_lbl: "安全含水率", m1_val: "< 1.2 %", m2_lbl: "通風風速", m2_val: "1.8 m/s", tags: ["流 - 發色純淨", "雅 - 煙氣極微"] },
        { id: "mortar", name: "09 迫擊砲排", q: -1, r: 2, theme: "#466f7f", stage: "工序 09", title: "迫擊砲管陣地與沙包掩體", desc: "排列 3 吋至 10 吋無縫鋼管與防爆沙包環，筒底裝填黑推進藥，提供球彈升空動能。", m1_lbl: "升空初速", m1_val: "115 m/s", m2_lbl: "砲口口徑", m2_val: "300 mm", tags: ["魄 - 破空重音", "流 - 筆直升空"] },
        { id: "efiring", name: "10 數位點火", q: 1, r: 1, theme: "#e09f3e", stage: "工序 10", title: "電子點火箱與時碼同步", desc: "以電氣點火頭（e-match）精確接收微秒級時碼控制指令，實現音樂與花火節奏咬合。", m1_lbl: "反應延遲", m1_val: "1.5 ms", m2_lbl: "同步路數", m2_val: "64 迴路", tags: ["流 - 節奏如歌", "雅 - 精準無誤"] },
        { id: "barge", name: "11 水上砲台", q: -2, r: 2, theme: "#2f5d62", stage: "工序 11", title: "浮橋駁船水上發射陣地", desc: "水上安全駁船配置防焰導流鋼板與消火水槽，提供大口徑尺玉與水中花火的安全施放。", m1_lbl: "安全警戒距", m1_val: "350 公尺", m2_lbl: "水中連射", m2_val: "12 連發", tags: ["魄 - 震天動地", "情 - 水面倒影"] },
        { id: "viewing", name: "12 花火鑑賞", q: -1, r: 0, theme: "#83587a", stage: "工序 12", title: "花火美學鑑賞看台", desc: "以『流、型、魄、情、雅』五大美學維度解讀夜空綻放，感受職人火藥工藝的精神。", m1_lbl: "開花直徑", m1_val: "280 公尺", m2_lbl: "滯空時間", m2_val: "6.8 秒", tags: ["流·型·魄·情·雅", "極致美學"] }
      ],
      lines: [
        { from: "chem", to: "star", item: "調和藥粉", role: "原料員", type: "official" },

        { from: "mortar", to: "barge", item: "水上發射彈", role: "陣地兵", type: "pending" }
      ],
      dayKeyframes: [
        { min: 0,    skyTop: 0x1e2c58, horizon: 0x3f4f80, sunColor: 0xb4c2ff, sunI: 1.15, hemiSky: 0x94a2d8, hemiGround: 0x64566a, hemiI: 1.85, night: 1.0,  water: 0x5a88b2 },
        { min: 300,  skyTop: 0x26365f, horizon: 0x4c5688, sunColor: 0xb8c4ff, sunI: 1.00, hemiSky: 0x96a4da, hemiGround: 0x66586c, hemiI: 1.85, night: 1.0,  water: 0x5c8ab4 },
        { min: 360,  skyTop: 0x7f8fc4, horizon: 0xf6c3a6, sunColor: 0xffb48a, sunI: 1.30, hemiSky: 0xf3c6b5, hemiGround: 0x6b5a5a, hemiI: 1.10, night: 0.55, water: 0x8fb7c4 },
        { min: 450,  skyTop: 0xa9d1ea, horizon: 0xfbe6d3, sunColor: 0xffe2c4, sunI: 2.40, hemiSky: 0xeaf2f6, hemiGround: 0x8a7a68, hemiI: 1.25, night: 0.0,  water: 0x9fcfd6 },
        { min: 720,  skyTop: 0x9fd0ec, horizon: 0xf4eee3, sunColor: 0xfff1de, sunI: 2.90, hemiSky: 0xeef6fa, hemiGround: 0x8f8270, hemiI: 1.35, night: 0.0,  water: 0xa9d8db },
        { min: 960,  skyTop: 0xa6cfe6, horizon: 0xf8e7d2, sunColor: 0xffe3c0, sunI: 2.50, hemiSky: 0xf1efe8, hemiGround: 0x8a7a66, hemiI: 1.25, night: 0.0,  water: 0x9fcbd2 },
        { min: 1065, skyTop: 0x8b8fc4, horizon: 0xf7b98f, sunColor: 0xff9f6a, sunI: 1.80, hemiSky: 0xf6d2bc, hemiGround: 0x7d6660, hemiI: 1.20, night: 0.3,  water: 0x93a9bd },
        { min: 1140, skyTop: 0x5a5e9e, horizon: 0xd99aa6, sunColor: 0xff9a7a, sunI: 1.30, hemiSky: 0xc0b2e0, hemiGround: 0x655868, hemiI: 1.35, night: 0.75, water: 0x6a7cab },
        { min: 1260, skyTop: 0x22325f, horizon: 0x445488, sunColor: 0xc0ccff, sunI: 1.20, hemiSky: 0x98a8dc, hemiGround: 0x685a6e, hemiI: 1.90, night: 1.0,  water: 0x5a88b2 },
        { min: 1440, skyTop: 0x1e2c58, horizon: 0x3f4f80, sunColor: 0xb4c2ff, sunI: 1.15, hemiSky: 0x94a2d8, hemiGround: 0x64566a, hemiI: 1.85, night: 1.0,  water: 0x5a88b2 }
      ]
    };

    const R = 2.02, SPACING = 2.28, TOP = 0.65, WATER_Y = -0.18;
    function axialToWorld(q, r) {
      return new THREE.Vector3(Math.sqrt(3) * SPACING * (q + r / 2), TOP, 1.5 * SPACING * r);
    }

    try {
      // 2. WebGL 與 CSS2D Renderer
      const canvas = document.getElementById('webgl-canvas');
      const cssContainer = document.getElementById('css-canvas');

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const labelRenderer = new CSS2DRenderer({ element: cssContainer });
      labelRenderer.setSize(window.innerWidth, window.innerHeight);

      const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.3, 320);
      const defaultCamDir = new THREE.Vector3(0.24, 0.33, 0.87).normalize();
      const defaultDist = window.innerWidth > 800 ? 28.5 : 44;
      camera.position.copy(defaultCamDir.clone().multiplyScalar(defaultDist));

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.enablePan = false;
      controls.minPolarAngle = THREE.MathUtils.degToRad(25);
      controls.maxPolarAngle = THREE.MathUtils.degToRad(72);
      controls.minDistance = 4;
      controls.maxDistance = 75;
      controls.target.set(0, 0.2, 0);

      const scene = new THREE.Scene();
      const fog = new THREE.Fog(0xf4eee3, 42, 150);
      scene.fog = fog;

      // 3. 天空與光照
      const skyGeo = new THREE.SphereGeometry(170, 32, 24);
      const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide, depthWrite: false, fog: false,
        uniforms: {
          uTop: { value: new THREE.Color() },
          uHorizon: { value: new THREE.Color() },
          uSunDir: { value: new THREE.Vector3() },
          uSun: { value: new THREE.Color() },
          uNight: { value: 0.0 }
        },
        vertexShader: `
          varying vec3 vWorldPosition;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPosition = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform vec3 uTop, uHorizon, uSunDir, uSun;
          uniform float uNight;
          varying vec3 vWorldPosition;
          float hash(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 45.164))) * 43758.5453); }
          void main() {
            vec3 dir = normalize(vWorldPosition);
            float h = smoothstep(-0.02, 0.55, dir.y);
            vec3 sky = mix(uHorizon, uTop, h);
            float sunDot = max(dot(dir, uSunDir), 0.0);
            sky += uSun * pow(sunDot, 18.0) * 0.35;
            if (uNight > 0.01) {
              float star = hash(floor(dir * 180.0));
              if (star > 0.9965 && dir.y > 0.05) {
                float tw = sin(dir.x * 50.0 + dir.z * 50.0) * 0.5 + 0.5;
                sky += vec3(0.9, 0.95, 1.0) * uNight * tw * 1.5;
              }
            }
            gl_FragColor = vec4(sky, 1.0);
          }
        `
      });
      scene.add(new THREE.Mesh(skyGeo, skyMat));

      const hemiLight = new THREE.HemisphereLight(0xeef6fa, 0x8f8270, 1.35);
      scene.add(hemiLight);

      const sunLight = new THREE.DirectionalLight(0xfff1de, 2.8);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.set(2048, 2048);
      sunLight.shadow.camera.left = -20;
      sunLight.shadow.camera.right = 20;
      sunLight.shadow.camera.top = 22;
      sunLight.shadow.camera.bottom = -22;
      sunLight.shadow.bias = -0.0006;
      sunLight.shadow.normalBias = 0.045;
      scene.add(sunLight);

      const fillLight = new THREE.DirectionalLight(0xbfd6ff, 0.35);
      scene.add(fillLight);

      // 煙火爆發全島點光源
      const burstFlashLight = new THREE.PointLight(0xffffff, 0, 90, 1.5);
      burstFlashLight.castShadow = true;
      scene.add(burstFlashLight);

      // 4. 水面 Shader
      const waterGeo = new THREE.CircleGeometry(160, 64);
      const waterMat = new THREE.ShaderMaterial({
        fog: true,
        uniforms: {
          uTime: { value: 0 },
          uWaterColor: { value: new THREE.Color(0xa4d4da) },
          uDeepColor: { value: new THREE.Color(0x6fa9b8) },
          fogColor: { value: fog.color },
          fogNear: { value: fog.near },
          fogFar: { value: fog.far }
        },
        vertexShader: `
          varying vec3 vWorldPos;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform vec3 uWaterColor, uDeepColor, fogColor;
          uniform float fogNear, fogFar;
          varying vec3 vWorldPos;
          void main() {
            float dist = length(vWorldPos.xz);
            float wave = sin(vWorldPos.x * 0.4 + uTime * 1.2) * cos(vWorldPos.z * 0.4 + uTime * 0.9);
            float blend = smoothstep(5.0, 45.0, dist) * 0.6 + wave * 0.08;
            vec3 col = mix(uWaterColor, uDeepColor, clamp(blend, 0.0, 1.0));
            float d = length(vWorldPos - cameraPosition);
            float fogFactor = smoothstep(fogNear, fogFar, d);
            gl_FragColor = vec4(mix(col, fogColor, fogFactor), 0.94);
          }
        `,
        transparent: true
      });
      const waterMesh = new THREE.Mesh(waterGeo, waterMat);
      waterMesh.rotation.x = -Math.PI / 2;
      waterMesh.position.y = WATER_Y;
      waterMesh.receiveShadow = true;
      scene.add(waterMesh);

      // 5. 連續程序地面貼圖
      function createGroundTexture() {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#f4ede2';
        ctx.fillRect(0, 0, 256, 256);
        ctx.strokeStyle = '#e6dcce';
        ctx.lineWidth = 3;
        for (let y = 0; y < 256; y += 32) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
          const shift = (y / 32) % 2 === 0 ? 0 : 16;
          for (let x = shift; x < 256; x += 32) {
            ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 32); ctx.stroke();
          }
        }
        for (let i = 0; i < 150; i++) {
          ctx.fillStyle = i % 2 === 0 ? 'rgba(219,106,65,0.06)' : 'rgba(163,78,52,0.05)';
          ctx.fillRect(Math.random() * 256, Math.random() * 256, 4, 4);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }
      const groundTexture = createGroundTexture();

      // 6. 共用微縮材質
      const hexGeo = new THREE.CircleGeometry(R - 0.05, 6).rotateZ(Math.PI / 6).rotateX(-Math.PI / 2);
      const groundMat = new THREE.MeshStandardMaterial({ roughness: 0.92, map: groundTexture });
      const walkMat = new THREE.MeshStandardMaterial({ color: 0xdeb89a, roughness: 0.88 });
      const curbMat = new THREE.MeshStandardMaterial({ color: 0xe4d6c3, roughness: 0.85 });
      const woodMat = new THREE.MeshStandardMaterial({ color: 0xb48560, roughness: 0.78 });
      const darkWoodMat = new THREE.MeshStandardMaterial({ color: 0x6e482b, roughness: 0.82 });
      const ironMat = new THREE.MeshStandardMaterial({ color: 0x3d4349, roughness: 0.5, metalness: 0.35 });
      const ballMat = new THREE.MeshStandardMaterial({ color: 0xd9653b, roughness: 0.7 });
      const sandMat = new THREE.MeshStandardMaterial({ color: 0xd6c498, roughness: 0.9 });
      const starGold = new THREE.MeshStandardMaterial({ color: 0xfcc419, roughness: 0.5 });
      const starPurple = new THREE.MeshStandardMaterial({ color: 0x9b5de5, roughness: 0.5 });
      const foamMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 });
      const shallowMat = new THREE.MeshBasicMaterial({ color: 0xb5e0e5, transparent: true, opacity: 0.45 });

      const islandGroup = new THREE.Group();
      scene.add(islandGroup);

      const islandPositions = new Map();
      const pills = [];
      const interactiveLaunchers = [];

      // 7. 建造 12 座工藝島與專屬微縮機台
      DATA.islands.forEach((isle) => {
        const pos = axialToWorld(isle.q, isle.r);
        islandPositions.set(isle.id, pos);

        const root = new THREE.Group();
        root.position.set(pos.x, 0, pos.z);

        // 島面、路緣、裝飾邊帶
        const topMesh = new THREE.Mesh(hexGeo, groundMat);
        topMesh.position.y = TOP;
        topMesh.receiveShadow = true;
        root.add(topMesh);

        const walkGeo = new THREE.RingGeometry(1.52, 1.8, 6).rotateZ(Math.PI / 6).rotateX(-Math.PI / 2);
        const walkMesh = new THREE.Mesh(walkGeo, walkMat);
        walkMesh.position.y = TOP + 0.003;
        root.add(walkMesh);

        const curbGeo = new THREE.RingGeometry(1.8, 1.95, 6).rotateZ(Math.PI / 6).rotateX(-Math.PI / 2);
        const curbMesh = new THREE.Mesh(curbGeo, curbMat);
        curbMesh.position.y = TOP + 0.005;
        curbMesh.receiveShadow = true;
        root.add(curbMesh);

        const decoGeo = new THREE.CylinderGeometry(R, R - 0.02, 0.16, 6).rotateY(Math.PI / 6);
        const decoMesh = new THREE.Mesh(decoGeo, new THREE.MeshStandardMaterial({ color: isle.theme, roughness: 0.7 }));
        decoMesh.position.y = TOP - 0.08;
        root.add(decoMesh);

        const cliffGeo = new THREE.CylinderGeometry(R - 0.02, R * 0.95, TOP - WATER_Y, 6).rotateY(Math.PI / 6);
        const cliffMesh = new THREE.Mesh(cliffGeo, new THREE.MeshStandardMaterial({ color: 0x937f6d, roughness: 0.95 }));
        cliffMesh.position.y = (TOP + WATER_Y) / 2;
        cliffMesh.receiveShadow = true;
        root.add(cliffMesh);

        const foamMesh = new THREE.Mesh(new THREE.RingGeometry(R + 0.02, R + 0.22, 24).rotateX(-Math.PI / 2), foamMat);
        foamMesh.position.y = WATER_Y + 0.01;
        root.add(foamMesh);

        const shallowMesh = new THREE.Mesh(new THREE.RingGeometry(R + 0.22, R + 0.75, 24).rotateX(-Math.PI / 2), shallowMat);
        shallowMesh.position.y = WATER_Y + 0.005;
        root.add(shallowMesh);

        // --- 工藝機台配置 ---
        if (isle.id === "pack") {
          // 06 尺玉剖面展示與裝星桌
          const table = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.25, 0.8), woodMat);
          table.position.set(0, TOP + 0.125, 0);
          table.castShadow = true;
          root.add(table);

          const cutaway = new THREE.Group();
          cutaway.position.set(0.15, TOP + 0.48, 0);
          cutaway.rotation.y = -0.4;
          const halfShell = new THREE.Mesh(new THREE.SphereGeometry(0.3, 20, 14, 0, Math.PI), ballMat);
          halfShell.rotation.x = Math.PI / 2;
          cutaway.add(halfShell);

          for (let i = 0; i < 7; i++) {
            const a = (i / 7) * Math.PI;
            const s = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), starPurple);
            s.position.set(Math.cos(a) * 0.15, Math.sin(a) * 0.15, 0.01);
            cutaway.add(s);
          }
          for (let i = 0; i < 12; i++) {
            const a = (i / 12) * Math.PI;
            const s = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 8), starGold);
            s.position.set(Math.cos(a) * 0.24, Math.sin(a) * 0.24, 0.01);
            cutaway.add(s);
          }
          root.add(cutaway);
        } else if (isle.id === "dry") {
          // 08 階梯風乾棚
          const rack = new THREE.Group();
          rack.position.set(0, TOP, 0);
          const roof = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.02, 0.85), new THREE.MeshStandardMaterial({ color: 0xd9c298 }));
          roof.position.set(0, 0.82, -0.05); roof.rotation.x = 0.25; roof.castShadow = true;
          rack.add(roof);
          [-0.2, 0.05, 0.3].forEach((z, idx) => {
            const tray = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.03, 0.22), woodMat);
            tray.position.set(0, 0.25 + idx * 0.16, z);
            rack.add(tray);
            for (let x = -0.4; x <= 0.4; x += 0.2) {
              const b = new THREE.Mesh(new THREE.SphereGeometry(0.025, 6, 6), idx === 0 ? starGold : starPurple);
              b.position.set(x, 0.28 + idx * 0.16, z);
              rack.add(b);
            }
          });
          root.add(rack);
        } else if (isle.id === "mortar") {
          // 09 迫擊砲管排與沙包掩體
          for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
            const sand = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.16, 0.2), sandMat);
            sand.position.set(Math.cos(a) * 0.95, TOP + 0.08, Math.sin(a) * 0.95);
            sand.rotation.y = -a; sand.castShadow = true;
            root.add(sand);
          }
          [-0.3, 0, 0.3].forEach((x, i) => {
            const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.09 + i * 0.02, 0.1 + i * 0.02, 0.75 + i * 0.15, 14), ironMat);
            tube.position.set(x, TOP + 0.4 + i * 0.07, 0);
            tube.rotation.z = (i - 1) * 0.08; tube.castShadow = true;
            root.add(tube);
            interactiveLaunchers.push(tube);
          });
        } else {
          // 其餘島通用黏土機台
          const house = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.5, 0.65), new THREE.MeshStandardMaterial({ color: 0xf4ebdd }));
          house.position.set(0, TOP + 0.25, -0.2); house.castShadow = true;
          const roof = new THREE.Mesh(new THREE.ConeGeometry(0.65, 0.35, 4), new THREE.MeshStandardMaterial({ color: isle.theme }));
          roof.position.set(0, TOP + 0.68, -0.2); roof.rotation.y = Math.PI / 4; roof.castShadow = true;
          root.add(house, roof);
        }

        // CSS2D 標籤
        const pillDiv = document.createElement('div');
        pillDiv.className = 'island-pill';
        pillDiv.textContent = isle.name;
        pillDiv.dataset.id = isle.id;

        const labelObj = new CSS2DObject(pillDiv);
        labelObj.position.set(0, TOP + 0.38, 1.55);
        root.add(labelObj);
        pills.push(pillDiv);

        pillDiv.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          selectIsland(isle.id);
        });

        islandGroup.add(root);
      });

      // 8. 拱橋系統
      const deckGeo = new THREE.BoxGeometry(0.3, 0.04, 0.12);
      function addBridge(posA, posB) {
        const group = new THREE.Group();
        for (let i = 0; i < 9; i++) {
          const t = (i + 0.5) / 9;
          const p = new THREE.Vector3().lerpVectors(posA, posB, t);
          const y = Math.sin(t * Math.PI) * 0.12 + TOP - 0.02;
          const deck = new THREE.Mesh(deckGeo, woodMat);
          deck.position.set(p.x, y, p.z);
          deck.rotation.y = Math.atan2(posB.x - posA.x, posB.z - posA.z) + Math.PI / 2;
          deck.castShadow = true;
          group.add(deck);
        }
        scene.add(group);
      }

      const connectedPairs = new Set();
      DATA.islands.forEach(a => {
        [{ q: 1, r: 0 }, { q: 1, r: -1 }, { q: 0, r: -1 }, { q: -1, r: 0 }, { q: -1, r: 1 }, { q: 0, r: 1 }].forEach(d => {
          const b = DATA.islands.find(item => item.q === a.q + d.q && item.r === a.r + d.r);
          if (b) {
            const key = [a.id, b.id].sort().join('--');
            if (!connectedPairs.has(key)) {
              connectedPairs.add(key);
              addBridge(islandPositions.get(a.id), islandPositions.get(b.id));
            }
          }
        });
      });

      // 9. 物流輸送管線 Shader
      const flowTubes = [];
      DATA.lines.forEach((line) => {
        const posA = islandPositions.get(line.from);
        const posB = islandPositions.get(line.to);
        if (!posA || !posB) return;

        const curve = new THREE.LineCurve3(
          posA.clone().add(new THREE.Vector3(0, TOP + 0.1, 0)),
          posB.clone().add(new THREE.Vector3(0, TOP + 0.1, 0))
        );
        const tubeGeo = new THREE.TubeGeometry(curve, 16, 0.035, 6, false);
        const tubeMat = new THREE.ShaderMaterial({
          transparent: true,
          uniforms: {
            uTime: { value: 0 },
            uColor: { value: new THREE.Color(0xdb6a41) },
            uType: { value: line.type === 'official' ? 1.0 : (line.type === 'thematic' ? 2.0 : 3.0) }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
          `,
          fragmentShader: `
            uniform float uTime, uType;
            uniform vec3 uColor;
            varying vec2 vUv;
            void main() {
              float u = vUv.x * 20.0 - uTime * 2.5;
              if (uType > 1.5 && uType < 2.5 && fract(u) > 0.6) discard;
              if (uType > 2.5 && fract(u) > 0.3) discard;
              gl_FragColor = vec4(uColor, 0.85);
            }
          `
        });
        const mesh = new THREE.Mesh(tubeGeo, tubeMat);
        mesh.visible = false;
        scene.add(mesh);
        flowTubes.push(mesh);
      });

      // 10. 職人小人與推車
      const workers = [];
      const workerGeo = new THREE.CapsuleGeometry(0.08, 0.14, 4, 8);
      const workerHeadGeo = new THREE.SphereGeometry(0.09, 10, 10);
      const workerClothesMat = new THREE.MeshStandardMaterial({ color: 0x2b4c7e });
      const workerSkinMat = new THREE.MeshStandardMaterial({ color: 0xf5cda7 });

      for (let w = 0; w < 3; w++) {
        const wGrp = new THREE.Group();
        const b = new THREE.Mesh(workerGeo, workerClothesMat); b.position.y = 0.22; b.castShadow = true;
        const h = new THREE.Mesh(workerHeadGeo, workerSkinMat); h.position.y = 0.38;
        const hat = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.06, 10), new THREE.MeshStandardMaterial({ color: 0xfcc419 }));
        hat.position.y = 0.46;
        wGrp.add(b, h, hat);
        scene.add(wGrp);

        workers.push({
          group: wGrp,
          routeIndex: w * 2,
          t: Math.random(),
          speed: 0.12 + Math.random() * 0.05,
          dir: 1
        });
      }

      function updateWorkers(dt) {
        workers.forEach(w => {
          w.t += dt * w.speed * w.dir;
          if (w.t >= 1) { w.t = 1; w.dir = -1; }
          else if (w.t <= 0) { w.t = 0; w.dir = 1; }

          const line = DATA.lines[w.routeIndex % DATA.lines.length];
          const pA = islandPositions.get(line.from);
          const pB = islandPositions.get(line.to);
          if (!pA || !pB) return;

          const curPos = new THREE.Vector3().lerpVectors(pA, pB, w.t);
          w.group.position.set(curPos.x, TOP, curPos.z);
          w.group.position.y += Math.abs(Math.sin(performance.now() * 0.008 + w.routeIndex)) * 0.02;
          w.group.lookAt(pB.x, TOP, pB.z);
        });
      }

      // 11. 夜空變色花火引擎
      const rockets = [];
      const sparks = [];
      let cameraShake = 0;

      const AESTHETIC_PALETTES = [
        { start: new THREE.Color(0x9b5de5), end: new THREE.Color(0xffbe3b), tail: new THREE.Color(0xffe29a) },
        { start: new THREE.Color(0x00f5d4), end: new THREE.Color(0xf15bb5), tail: new THREE.Color(0xffd166) },
        { start: new THREE.Color(0xff4500), end: new THREE.Color(0xffd700), tail: new THREE.Color(0xffffff) }
      ];

      function launchFirework() {
        const pal = AESTHETIC_PALETTES[Math.floor(Math.random() * AESTHETIC_PALETTES.length)];
        const mPos = islandPositions.get("mortar") || new THREE.Vector3(0, 0, 0);
        rockets.push({
          pos: new THREE.Vector3(mPos.x, TOP + 0.8, mPos.z),
          vel: new THREE.Vector3((Math.random() - 0.5) * 0.4, 9.0 + Math.random() * 1.5, (Math.random() - 0.5) * 0.4),
          targetY: 11.0 + Math.random() * 3.5,
          palette: pal
        });
        addLog("迫擊砲台電氣點火，尺玉騰空！");
      }

      function explodeFirework(pos, pal) {
        burstFlashLight.position.copy(pos);
        burstFlashLight.color.copy(pal.start);
        burstFlashLight.intensity = 20.0;
        cameraShake = 0.22;

        const count = 160;
        const positions = [];
        const colors = [];
        const vels = [];

        for (let i = 0; i < count; i++) {
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(Math.random() * 2 - 1);
          const spd = 3.2 + Math.random() * 3.2;
          vels.push(new THREE.Vector3(Math.sin(phi) * Math.cos(theta) * spd, Math.sin(phi) * Math.sin(theta) * spd, Math.cos(phi) * spd));
          positions.push(pos.x, pos.y, pos.z);
          colors.push(pal.start.r, pal.start.g, pal.start.b);
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const mat = new THREE.PointsMaterial({ size: 0.32, vertexColors: true, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false });
        const mesh = new THREE.Points(geo, mat);
        scene.add(mesh);

        sparks.push({ mesh, geo, vels, life: 1.0, decay: 0.5, pal });
        addLog("夜空真球綻放：菊先轉金冠錦落柳");
      }

      function updateFireworks(dt) {
        if (burstFlashLight.intensity > 0) burstFlashLight.intensity = Math.max(0, burstFlashLight.intensity - dt * 26.0);

        for (let i = rockets.length - 1; i >= 0; i--) {
          const r = rockets[i];
          r.pos.addScaledVector(r.vel, dt);
          r.vel.y -= 3.6 * dt;
          if (r.pos.y >= r.targetY || r.vel.y <= 0) {
            explodeFirework(r.pos, r.palette);
            rockets.splice(i, 1);
          }
        }

        for (let i = sparks.length - 1; i >= 0; i--) {
          const s = sparks[i];
          s.life -= s.decay * dt;
          s.mesh.material.opacity = Math.max(0, Math.pow(s.life, 1.2));

          const posArr = s.geo.attributes.position.array;
          const colArr = s.geo.attributes.color.array;
          const curCol = new THREE.Color().lerpColors(s.pal.start, s.pal.end, Math.min((1.0 - s.life) * 1.5, 1.0));

          for (let j = 0; j < s.vels.length; j++) {
            const v = s.vels[j];
            posArr[j * 3] += v.x * dt;
            posArr[j * 3 + 1] += v.y * dt;
            posArr[j * 3 + 2] += v.z * dt;
            v.x *= 0.965; v.z *= 0.965; v.y -= 2.6 * dt;
            colArr[j * 3] = curCol.r; colArr[j * 3 + 1] = curCol.g; colArr[j * 3 + 2] = curCol.b;
          }
          s.geo.attributes.position.needsUpdate = true;
          s.geo.attributes.color.needsUpdate = true;

          if (s.life <= 0) {
            scene.remove(s.mesh);
            s.geo.dispose();
            s.mesh.material.dispose();
            sparks.splice(i, 1);
          }
        }
      }

      // 12. 日夜時間插值計算
      let currentTime = 720;
      function updateDayCycle(mins) {
        currentTime = mins % 1440;
        const kfs = DATA.dayKeyframes;
        let k1 = kfs[0], k2 = kfs[1];
        for (let i = 0; i < kfs.length - 1; i++) {
          if (currentTime >= kfs[i].min && currentTime <= kfs[i + 1].min) {
            k1 = kfs[i]; k2 = kfs[i + 1]; break;
          }
        }
        const span = k2.min - k1.min;
        const factor = span === 0 ? 0 : (currentTime - k1.min) / span;

        const skyTop = new THREE.Color(k1.skyTop).lerp(new THREE.Color(k2.skyTop), factor);
        const horizon = new THREE.Color(k1.horizon).lerp(new THREE.Color(k2.horizon), factor);
        const sunColor = new THREE.Color(k1.sunColor).lerp(new THREE.Color(k2.sunColor), factor);
        const waterColor = new THREE.Color(k1.water).lerp(new THREE.Color(k2.water), factor);
        const hemiSky = new THREE.Color(k1.hemiSky).lerp(new THREE.Color(k2.hemiSky), factor);
        const hemiGround = new THREE.Color(k1.hemiGround).lerp(new THREE.Color(k2.hemiGround), factor);

        const sunI = THREE.MathUtils.lerp(k1.sunI, k2.sunI, factor);
        const hemiI = THREE.MathUtils.lerp(k1.hemiI, k2.hemiI, factor);
        const night = THREE.MathUtils.lerp(k1.night, k2.night, factor);

        const quantTime = Math.floor(currentTime / 10) * 10;
        const t = THREE.MathUtils.clamp((quantTime - 360) / 720, 0, 1);
        const az = Math.PI * (0.15 + 0.7 * t);
        const el = 0.35 + Math.sin(t * Math.PI) * 0.75;
        const dir = new THREE.Vector3(Math.cos(az) * Math.cos(el), Math.sin(el), 0.55 * Math.cos(el) + 0.35).normalize();

        sunLight.position.copy(dir.clone().multiplyScalar(40));
        sunLight.color.copy(sunColor);
        sunLight.intensity = sunI;

        hemiLight.color.copy(hemiSky);
        hemiLight.groundColor.copy(hemiGround);
        hemiLight.intensity = hemiI;

        fog.color.copy(horizon);

        skyMat.uniforms.uTop.value.copy(skyTop);
        skyMat.uniforms.uHorizon.value.copy(horizon);
        skyMat.uniforms.uSunDir.value.copy(dir);
        skyMat.uniforms.uSun.value.copy(sunColor);
        skyMat.uniforms.uNight.value = night;

        waterMat.uniforms.uWaterColor.value.copy(waterColor);
        waterMat.uniforms.fogColor.value.copy(horizon);

        const hh = String(Math.floor(currentTime / 60)).padStart(2, '0');
        const mm = String(Math.floor(currentTime % 60)).padStart(2, '0');
        document.getElementById('hud-clock').textContent = `${hh}:${mm}`;

        const tip = document.getElementById('fire-tip');
        tip.style.opacity = night > 0.6 ? '1' : '0';
      }

      // 13. 相機飛行與互動導航
      let isFlying = false, flyStart = 0, flyDur = 800;
      const startCam = new THREE.Vector3(), endCam = new THREE.Vector3();
      const startTar = new THREE.Vector3(), endTar = new THREE.Vector3();

      function flyTo(target, duration = 800, offset = new THREE.Vector3(2.75, 5.3, 6.2)) {
        isFlying = true;
        flyStart = performance.now();
        flyDur = duration;
        startCam.copy(camera.position);
        endCam.copy(target).add(offset);
        startTar.copy(controls.target);
        endTar.copy(target);
      }
      controls.addEventListener('start', () => { isFlying = false; });

      const infoPanel = document.getElementById('info-panel');
      function selectIsland(id) {
        const data = DATA.islands.find(d => d.id === id);
        if (!data) return;

        document.getElementById('info-stage').textContent = data.stage;
        document.getElementById('info-title').textContent = data.title;
        document.getElementById('info-desc').textContent = data.desc;
        document.getElementById('m1-label').textContent = data.m1_lbl;
        document.getElementById('m1-val').textContent = data.m1_val;
        document.getElementById('m2-label').textContent = data.m2_lbl;
        document.getElementById('m2-val').textContent = data.m2_val;

        const tagContainer = document.getElementById('aes-tags');
        tagContainer.innerHTML = '';
        data.tags.forEach(t => {
          const s = document.createElement('span');
          s.className = 'aes-tag'; s.textContent = t;
          tagContainer.appendChild(s);
        });

        infoPanel.classList.remove('hidden');
        pills.forEach(p => p.classList.toggle('selected', p.dataset.id === id));
        document.querySelectorAll('.sidebar-item').forEach(it => it.classList.toggle('active', it.dataset.id === id));

        const pos = islandPositions.get(id);
        flyTo(pos, 800, new THREE.Vector3(1.8, 3.4, 4.4));
        addLog(`已聚焦：${data.name}`);
      }

      document.getElementById('btn-close-info').addEventListener('click', () => {
        infoPanel.classList.add('hidden');
        pills.forEach(p => p.classList.remove('selected'));
        document.querySelectorAll('.sidebar-item').forEach(it => it.classList.remove('active'));
      });

      // 14. 側欄清單渲染與搜尋
      const sidebarList = document.getElementById('sidebar-list');
      function renderSidebarIslands(filter = '') {
        sidebarList.innerHTML = '';
        DATA.islands.forEach(isle => {
          if (filter && !isle.name.includes(filter) && !isle.title.includes(filter)) return;
          const item = document.createElement('div');
          item.className = 'sidebar-item';
          item.dataset.id = isle.id;
          item.innerHTML = `<span>${isle.name}</span><span style="font-size:10px;color:var(--coral);">${isle.stage}</span>`;
          item.addEventListener('click', () => selectIsland(isle.id));
          sidebarList.appendChild(item);
        });
      }

      function renderSidebarLines() {
        sidebarList.innerHTML = '';
        DATA.lines.forEach(line => {
          const item = document.createElement('div');
          item.className = 'sidebar-item';
          item.innerHTML = `<span>${line.from} ➔ ${line.to}</span><span style="font-size:10px;color:var(--slate);">${line.item}</span>`;
          sidebarList.appendChild(item);
        });
      }
      renderSidebarIslands();

      document.getElementById('sidebar-search').addEventListener('input', (e) => {
        renderSidebarIslands(e.target.value.trim());
      });

      document.getElementById('tab-islands').addEventListener('click', () => {
        document.getElementById('tab-islands').classList.add('active');
        document.getElementById('tab-lines').classList.remove('active');
        renderSidebarIslands();
      });
      document.getElementById('tab-lines').addEventListener('click', () => {
        document.getElementById('tab-lines').classList.add('active');
        document.getElementById('tab-islands').classList.remove('active');
        renderSidebarLines();
      });

      // 15. 即時日誌工具
      function addLog(msg) {
        const stream = document.getElementById('log-stream');
        const div = document.createElement('div');
        const hh = String(Math.floor(currentTime / 60)).padStart(2, '0');
        const mm = String(Math.floor(currentTime % 60)).padStart(2, '0');
        div.textContent = `[${hh}:${mm}] ${msg}`;
        stream.prepend(div);
        if (stream.children.length > 4) stream.removeChild(stream.lastChild);
      }

      // 16. HUD 事件
      document.querySelectorAll('.bottom-hud .hud-btn[data-time]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.bottom-hud .hud-btn[data-time]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          updateDayCycle(parseInt(btn.dataset.time, 10));
        });
      });

      let showLines = false;
      document.getElementById('btn-toggle-flow').addEventListener('click', (e) => {
        showLines = !showLines;
        flowTubes.forEach(t => t.visible = showLines);
        e.target.classList.toggle('active', showLines);
      });

      let isTopView = false;
      document.getElementById('btn-toggle-cam').addEventListener('click', (e) => {
        isTopView = !isTopView;
        if (isTopView) {
          flyTo(new THREE.Vector3(0, 0, 0), 900, new THREE.Vector3(0.01, 42, 6));
          e.target.classList.add('active');
        } else {
          flyTo(new THREE.Vector3(0, 0, 0), 800, defaultCamDir.clone().multiplyScalar(defaultDist));
          e.target.classList.remove('active');
        }
      });

      document.getElementById('btn-reset').addEventListener('click', () => {
        isTopView = false;
        document.getElementById('btn-toggle-cam').classList.remove('active');
        flyTo(new THREE.Vector3(0, 0.2, 0), 800, defaultCamDir.clone().multiplyScalar(defaultDist));
        infoPanel.classList.add('hidden');
        pills.forEach(p => p.classList.remove('selected'));
        document.querySelectorAll('.sidebar-item').forEach(it => it.classList.remove('active'));
      });

      document.getElementById('btn-fire').addEventListener('click', () => {
        if (currentTime < 1200) {
          document.querySelectorAll('.bottom-hud .hud-btn[data-time]').forEach(b => b.classList.remove('active'));
          document.querySelector('.bottom-hud .hud-btn[data-time="1260"]').classList.add('active');
          updateDayCycle(1260);
        }
        launchFirework();
      });

      // 17. 點擊砲管發射
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      let downX = 0, downY = 0;

      window.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });
      window.addEventListener('pointerup', (e) => {
        if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const hits = raycaster.intersectObjects(interactiveLaunchers, false);
        if (hits.length > 0) {
          if (currentTime < 1200) {
            document.querySelectorAll('.bottom-hud .hud-btn[data-time]').forEach(b => b.classList.remove('active'));
            document.querySelector('.bottom-hud .hud-btn[data-time="1260"]').classList.add('active');
            updateDayCycle(1260);
          }
          launchFirework();
        }
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
      });

      // 18. 主渲染迴圈
      let last = performance.now();
      function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.min((now - last) / 1000, 0.08);
        last = now;

        waterMat.uniforms.uTime.value += dt;
        flowTubes.forEach(t => t.material.uniforms.uTime.value += dt);

        updateWorkers(dt);
        updateFireworks(dt);

        if (cameraShake > 0) {
          camera.position.x += (Math.random() - 0.5) * cameraShake;
          camera.position.y += (Math.random() - 0.5) * cameraShake;
          cameraShake = Math.max(0, cameraShake - dt * 0.9);
        }

        if (isFlying) {
          const p = Math.min((now - flyStart) / flyDur, 1.0);
          const ease = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
          camera.position.lerpVectors(startCam, endCam, ease);
          controls.target.lerpVectors(startTar, endTar, ease);
          if (p >= 1.0) isFlying = false;
        }

        controls.update();
        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
      }

      updateDayCycle(currentTime);
      selectIsland("pack");
      requestAnimationFrame(animate);

    } catch (err) {
      console.error("Three.js 初始化失敗:", err);
      const m = document.getElementById('error-modal');
      const msg = document.getElementById('error-msg');
      if (m && msg) { m.style.display = 'block'; msg.textContent = err.message; }
    }
  </script>
</body>
</html>
