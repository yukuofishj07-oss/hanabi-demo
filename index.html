    /* ========================================================
       2. 確定性隨機數與數學座標工具
       ======================================================== */
    let seed = 19890604;
    function mulberry32() {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    const rand = mulberry32;

    function axialToWorld(q, r) {
      return {
        x: Math.sqrt(3) * SPACING * (q + r / 2),
        z: 1.5 * SPACING * r
      };
    }

    /* ========================================================
       3. 全域狀態變數
       ======================================================== */
    let scene, camera, renderer, cssRenderer, controls;
    let clock = new THREE.Clock();
    let currentMinutes = 1260;
    let isNight = 1.0;
    let isFlying = false;
    let flightStart = 0;
    let flightDuration = 800;
    let camStartPos = new THREE.Vector3(), camEndPos = new THREE.Vector3();
    let tgtStartPos = new THREE.Vector3(), tgtEndPos = new THREE.Vector3();

    let islandMeshes = [];
    let clickableItems = [];

    let skySphere, waterMesh, basinMesh;

    /* ========================================================
       4. 煙火粒子、日夜與飛行函式
       ======================================================== */
    function triggerFirework(origin, colorHex = '#ff8833') {
      const particleCount = 130;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(particleCount * 3);
      const velocities = [];

      for (let i = 0; i < particleCount; i++) {
        pos[i * 3 + 0] = origin.x;
        pos[i * 3 + 1] = origin.y;
        pos[i * 3 + 2] = origin.z;

        const u = rand(), v = rand();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const speed = 2.2 + rand() * 2.0;

        velocities.push(new THREE.Vector3(
          speed * Math.sin(phi) * Math.cos(theta),
          speed * Math.sin(phi) * Math.sin(theta) + 1.2,
          speed * Math.cos(phi)
        ));
      }

      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({
        color: new THREE.Color(colorHex),
        size: 0.16,
        transparent: true,
        opacity: 1.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const pSystem = new THREE.Points(geo, mat);
      scene.add(pSystem);
      fireworksArray.push({ points: pSystem, velocities, life: 1.0, decay: 0.015 + rand() * 0.008 });
    }

    function setDayTime(minutes) {
      if (!skySphere || !sunLight) return;
      currentMinutes = minutes % 1440;
      let k1 = DAY_KEYFRAMES[0], k2 = DAY_KEYFRAMES[1];
      for (let i = 0; i < DAY_KEYFRAMES.length - 1; i++) {
        if (currentMinutes >= DAY_KEYFRAMES[i].min && currentMinutes <= DAY_KEYFRAMES[i + 1].min) {
          k1 = DAY_KEYFRAMES[i];
          k2 = DAY_KEYFRAMES[i + 1];
          break;
        }
      }

      const factor = (currentMinutes - k1.min) / (k2.min - k1.min);
      isNight = THREE.MathUtils.lerp(k1.night, k2.night, factor);

      const topCol = new THREE.Color(k1.skyTop).lerp(new THREE.Color(k2.skyTop), factor);
      const hozCol = new THREE.Color(k1.skyHoz).lerp(new THREE.Color(k2.skyHoz), factor);
      const sunCol = new THREE.Color(k1.sunCol).lerp(new THREE.Color(k2.sunCol), factor);

      skySphere.material.uniforms.uTop.value.copy(topCol);
      skySphere.material.uniforms.uHorizon.value.copy(hozCol);
      skySphere.material.uniforms.uNight.value = isNight;
      scene.fog.color.copy(hozCol);

      sunLight.color.copy(sunCol);
      sunLight.intensity = THREE.MathUtils.lerp(k1.sunI, k2.sunI, factor);

      const t = Math.max(0, Math.min(1, (currentMinutes - 360) / 720));
      const az = Math.PI * (0.15 + 0.7 * t);
      const el = 0.35 + Math.sin(t * Math.PI) * 0.75;
      sunLight.position.set(Math.cos(az) * Math.cos(el) * 40, Math.sin(el) * 40, (0.55 * Math.cos(el) + 0.35) * 40);
      skySphere.material.uniforms.uSunDir.value.copy(sunLight.position).normalize();
    }

    function flyToTarget(targetPos, offsetDistance = 14) {
      isFlying = true;
      flightStart = performance.now();
      camStartPos.copy(camera.position);
      tgtStartPos.copy(controls.target);
      tgtEndPos.copy(targetPos);
      const direction = new THREE.Vector3(0.24, 0.42, 0.85).normalize();
      camEndPos.copy(targetPos).add(direction.multiplyScalar(offsetDistance));
    }

    function selectIsland(islandId) {
      const isl = DATA.islands.find(i => i.id === islandId);
      if (!isl) return;

      document.getElementById('card-title').innerText = isl.name;
      document.getElementById('card-desc').innerText = isl.summary;

      document.getElementById('card-facts').innerHTML = isl.facts.map(f => `

    window.selectItemById = function(itemId) {

    /* ========================================================
       5. 建造場景與模型零件庫
       ======================================================== */
    function initEnvironment() {
      const skyGeo = new THREE.SphereGeometry(170, 32, 16);
      const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide, depthWrite: false, fog: false,
        uniforms: {
          uTop: { value: new THREE.Color(0x22325f) },
          uHorizon: { value: new THREE.Color(0x445488) },
          uNight: { value: 1.0 },
          uSunDir: { value: new THREE.Vector3(0, 1, 0) }
        },
        vertexShader: `
          varying vec3 vWorldPosition;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPosition = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform vec3 uTop, uHorizon, uSunDir;
          uniform float uNight;
          varying vec3 vWorldPosition;
          float hash(vec3 p) { return fract(sin(dot(p, vec3(12.9898, 78.233, 45.164))) * 43758.5453); }
          void main() {
            vec3 dir = normalize(vWorldPosition);
            float h = smoothstep(-0.04, 0.65, dir.y);
            vec3 col = mix(uHorizon, uTop, h);
            float sunDot = max(0.0, dot(dir, normalize(uSunDir)));
            col += pow(sunDot, 18.0) * 0.35 * (1.0 - uNight);
            if (uNight > 0.05 && dir.y > 0.05) {
              float s = hash(floor(dir * 180.0));
              if (s > 0.9965) col += vec3(0.95) * (s - 0.9965) * 600.0 * uNight;
            }
            gl_FragColor = vec4(col, 1.0);
          }
        `
      });
      skySphere = new THREE.Mesh(skyGeo, skyMat);
      scene.add(skySphere);

      hemiLight = new THREE.HemisphereLight(0x98a8dc, 0x685a6e, 1.85);
      scene.add(hemiLight);

      sunLight = new THREE.DirectionalLight(0xc0ccff, 1.2);
      sunLight.position.set(18, 36, 22);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.set(2048, 2048);
      sunLight.shadow.camera.near = 1;
      sunLight.shadow.camera.far = 90;
      sunLight.shadow.camera.left = -22;
      sunLight.shadow.camera.right = 22;
      sunLight.shadow.camera.top = 22;
      sunLight.shadow.camera.bottom = -22;
      sunLight.shadow.bias = -0.0006;
      scene.add(sunLight);

      fillLight = new THREE.DirectionalLight(0xbfd6ff, 0.35);
      fillLight.position.set(-18, 15, -18);
      scene.add(fillLight);

      const waterGeo = new THREE.CircleGeometry(160, 64);
      const waterMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uShallow: { value: new THREE.Color(0x5a88b2) },
          uDeep: { value: new THREE.Color(0x234168) },
          fogColor: { value: scene.fog.color },
          fogNear: { value: scene.fog.near },
          fogFar: { value: scene.fog.far }
        },
        vertexShader: `
          varying vec3 vWorldPos;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform vec3 uShallow, uDeep, fogColor;
          uniform float fogNear, fogFar;
          varying vec3 vWorldPos;
          void main() {
            float dist = length(vWorldPos.xz);
            float waves = sin(vWorldPos.x * 0.45 + uTime * 1.2) * cos(vWorldPos.z * 0.45 + uTime * 1.0);
            vec3 col = mix(uShallow, uDeep, smoothstep(12.0, 65.0, dist)) + waves * 0.035;
            float depth = length(vWorldPos - cameraPosition);
            float fogFactor = smoothstep(fogNear, fogFar, depth);
            gl_FragColor = vec4(mix(col, fogColor, fogFactor), 0.95);
          }
        `,
        transparent: true
      });
      waterMesh = new THREE.Mesh(waterGeo, waterMat);
      waterMesh.rotation.x = -Math.PI / 2;
      waterMesh.position.y = WATER_Y;
      scene.add(waterMesh);

      const basinGeo = new THREE.PlaneGeometry(160, 160, 48, 48);
      basinGeo.rotateX(-Math.PI / 2);
      const pos = basinGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i), z = pos.getZ(i);
        let d = Math.sqrt(x * x + z * z);
        let y = -0.3;
        if (d > 22 && d < 65) {
          let h = Math.sin((d - 22) / 43 * Math.PI) * 11.0;
          if (z > 15) h *= 0.35;
          y += h + (rand() - 0.5) * 1.2;
        }
        pos.setY(i, y);
      }
      basinGeo.computeVertexNormals();
      basinMesh = new THREE.Mesh(basinGeo, new THREE.MeshStandardMaterial({ color: 0x5a7652, roughness: 0.95, flatShading: true }));
      basinMesh.position.y = -0.15;
      scene.add(basinMesh);
    }

    function initIslands() {
      const hexGeo = new THREE.CylinderGeometry(R, R, TOP, 6);
      hexGeo.rotateY(Math.PI / 6);

      const islandMat = new THREE.MeshStandardMaterial({ color: 0xeddccf, roughness: 0.88 });

      DATA.islands.forEach(isl => {
        const { x, z } = axialToWorld(isl.q, isl.r);
        islandCenterCoords[isl.id] = new THREE.Vector3(x, TOP, z);

        const group = new THREE.Group();
        group.position.set(x, TOP / 2, z);

        const mesh = new THREE.Mesh(hexGeo, islandMat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData = { isIsland: true, islandId: isl.id };
        group.add(mesh);
        islandMeshes.push(mesh);

        const rim = new THREE.Mesh(
          new THREE.CylinderGeometry(R + 0.02, R + 0.02, 0.16, 6),
          new THREE.MeshStandardMaterial({ color: isl.colorTheme, roughness: 0.75 })
        );
        rim.rotateY(Math.PI / 6);
        rim.position.y = TOP / 2 - 0.08;
        group.add(rim);

        const pillDiv = document.createElement('div');
        pillDiv.className = 'island-label-pill';

        pillDiv.onclick = (e) => { e.stopPropagation(); selectIsland(isl.id); };

        const labelObj = new CSS2DObject(pillDiv);
        labelObj.position.set(0, TOP / 2 + 0.7, 1.8);
        group.add(labelObj);

        scene.add(group);
      });
    }

    function initBuildings() {
      const mWhite = new THREE.MeshStandardMaterial({ color: 0xf4ebdd, roughness: 0.8 });
      const mCoral = new THREE.MeshStandardMaterial({ color: 0xdb6a41, roughness: 0.78 });
      const mWood = new THREE.MeshStandardMaterial({ color: 0x9b5a38, roughness: 0.85 });
      const mGold = new THREE.MeshStandardMaterial({ color: 0xfcea8b, roughness: 0.5, metalness: 0.2 });

      DATA.islands.forEach(isl => {
        const c = islandCenterCoords[isl.id];

        // Landmark
        const landmark = new THREE.Group();
        if (isl.id === "isl_spire") {
          const spire = new THREE.Mesh(new THREE.ConeGeometry(0.38, 2.4, 6), mCoral);
          spire.position.y = 1.6;
          const orb = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 12), mGold);
          orb.position.y = 2.85;
          landmark.add(spire, orb);
        } else {
          const base = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.8), mWhite);
          base.position.y = 0.25;
          const roof = new THREE.Mesh(new THREE.ConeGeometry(0.7, 0.45, 4), mCoral);
          roof.position.y = 0.72;
          roof.rotation.y = Math.PI / 4;
          landmark.add(base, roof);
        }
        landmark.position.set(c.x, c.y, c.z - 0.35);
        scene.add(landmark);

        // Sub items
        isl.items.forEach((item, idx) => {
          const itemMesh = new THREE.Group();
          const baseP = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.28, 0.05, 8), mWood);
          baseP.position.y = 0.025;
          const marker = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.25), mCoral);
          marker.position.y = 0.16;
          itemMesh.add(baseP, marker);

          const theta = (idx / isl.items.length) * Math.PI * 1.5 - Math.PI * 0.75;
          itemMesh.position.set(c.x + Math.cos(theta) * 0.95, c.y, c.z + Math.sin(theta) * 0.95 + 0.35);
          itemMesh.userData = { isItem: true, itemId: item.id };
          scene.add(itemMesh);
          clickableItems.push(itemMesh);
        });
      });
    }

    function initCollaborations() {
      DATA.collaborations.forEach(collab => {
        const pA = islandCenterCoords[collab.from];
        const pB = islandCenterCoords[collab.to];
        if (!pA || !pB) return;

        const mid = new THREE.Vector3().addVectors(pA, pB).multiplyScalar(0.5);
        mid.y += 0.45;

        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(pA.x, TOP + 0.05, pA.z),
          mid,
          new THREE.Vector3(pB.x, TOP + 0.05, pB.z)
        ]);

        const tubeMat = new THREE.ShaderMaterial({
          transparent: true,
          uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0xdb6a41) } },
          vertexShader: `
            varying vec2 vUv;
            void main() { vUv = uv; gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0); }
          `,
          fragmentShader: `
            uniform float uTime; uniform vec3 uColor; varying vec2 vUv;
            void main() {
              if (fract(vUv.x * 4.0 - uTime * 1.5) > 0.6) discard;
              gl_FragColor = vec4(uColor, 0.85);
            }
          `
        });
        const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 20, 0.03, 6, false), tubeMat);
        tube.visible = false;
        scene.add(tube);
        collabTubes.push(tube);

        // Chibi walker
        const walker = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), new THREE.MeshStandardMaterial({ color: 0x3e7c8c }));
        walker.userData = { curve, progress: rand(), speed: 0.08 + rand() * 0.04, direction: 1 };
        scene.add(walker);
        walkersList.push(walker);
      });
    }

    /* ========================================================
       6. 互動監聽與動畫主迴圈

    function initListeners() {
      document.getElementById('time-dawn').onclick = () => { setActiveTime('time-dawn'); setDayTime(360); };
      document.getElementById('time-noon').onclick = () => { setActiveTime('time-noon'); setDayTime(720); };
      document.getElementById('time-dusk').onclick = () => { setActiveTime('time-dusk'); setDayTime(1080); };
      document.getElementById('time-night').onclick = () => { setActiveTime('time-night'); setDayTime(1260); };

      function setActiveTime(id) {
        ['time-dawn', 'time-noon', 'time-dusk', 'time-night'].forEach(b => document.getElementById(b).classList.remove('active'));
        document.getElementById(id).classList.add('active');
      }

      document.getElementById('card-close-btn').onclick = () => {
        document.getElementById('detail-card').classList.remove('active');
        document.querySelectorAll('.island-label-pill').forEach(el => el.classList.remove('selected'));
      };

      let collabsActive = false;
      document.getElementById('toggle-collab').onclick = function() {
        collabsActive = !collabsActive;
        this.classList.toggle('active', collabsActive);
        collabTubes.forEach(t => t.visible = collabsActive);
      };

      document.getElementById('toggle-birds').onclick = () => flyToTarget(new THREE.Vector3(0.01, 40, 6), 1);

      document.getElementById('fire-firework').onclick = () => {
        const randIsl = DATA.islands[Math.floor(rand() * DATA.islands.length)];
        const pos = islandCenterCoords[randIsl.id];
        triggerFirework(new THREE.Vector3(pos.x, 8 + rand() * 5, pos.z), randIsl.colorTheme);
      };

      document.getElementById('toggle-sidebar').onclick = () => document.getElementById('sidebar').classList.toggle('closed');

      const sidebarList = document.getElementById('sidebar-list');
      DATA.islands.forEach(isl => {
        const acc = document.createElement('details');
        acc.className = 'island-accordion';
        acc.innerHTML = `
          <summary class="island-summary"><span>${isl.num} ${isl.name}</span><span>+</span></summary>
          <div class="island-subitems">
            ${isl.items.map(it => `<button class="subitem-btn" onclick="window.selectItemById('${it.id}')">✦ ${it.name}</button>`).join('')}
          </div>
        `;
        sidebarList.appendChild(acc);
      });

      document.getElementById('search-input').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase().trim();
        document.querySelectorAll('.island-accordion').forEach(acc => {
          acc.style.display = acc.innerText.toLowerCase().includes(q) ? 'block' : 'none';
        });
      });

      // Raycast Click
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      let pDown = { x: 0, y: 0 };

      window.addEventListener('pointerdown', e => { pDown = { x: e.clientX, y: e.clientY }; if (isFlying) isFlying = false; });
      window.addEventListener('pointerup', e => {
        if (Math.hypot(e.clientX - pDown.x, e.clientY - pDown.y) > 6) return;
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects([...islandMeshes, ...clickableItems], true);
        if (hits.length > 0) {
          let obj = hits[0].object;
          while (obj && !obj.userData?.isIsland && !obj.userData?.isItem) obj = obj.parent;
          if (obj?.userData?.isIsland) selectIsland(obj.userData.islandId);
          else if (obj?.userData?.isItem) window.selectItemById(obj.userData.itemId);
        }
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        cssRenderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function animate(time) {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.08);

      if (waterMesh) waterMesh.material.uniforms.uTime.value += delta;
      collabTubes.forEach(t => t.material.uniforms.uTime.value += delta);

      walkersList.forEach(w => {
        const u = w.userData;
        u.progress += delta * u.speed * u.direction;
        if (u.progress > 1.0) { u.progress = 1.0; u.direction = -1; }
        else if (u.progress < 0.0) { u.progress = 0.0; u.direction = 1; }
        w.position.copy(u.curve.getPointAt(u.progress));
        w.position.y += 0.15;
      });

      for (let i = fireworksArray.length - 1; i >= 0; i--) {
        const fw = fireworksArray[i];
        const posAttr = fw.points.geometry.attributes.position;
        fw.life -= fw.decay;
        for (let p = 0; p < fw.velocities.length; p++) {
          fw.velocities[p].y -= 2.2 * delta;
          posAttr.setXYZ(p, posAttr.getX(p) + fw.velocities[p].x * delta, posAttr.getY(p) + fw.velocities[p].y * delta, posAttr.getZ(p) + fw.velocities[p].z * delta);
        }
        posAttr.needsUpdate = true;
        fw.points.material.opacity = Math.max(0, fw.life);
        if (fw.life <= 0) {
          scene.remove(fw.points);
          fw.points.geometry.dispose();
          fw.points.material.dispose();
          fireworksArray.splice(i, 1);
        }
      }

      if (isNight > 0.6 && rand() < 0.02) {
        const randIsl = DATA.islands[Math.floor(rand() * DATA.islands.length)];
        const pos = islandCenterCoords[randIsl.id];
        triggerFirework(new THREE.Vector3(pos.x + (rand() - 0.5) * 3, 7 + rand() * 6, pos.z + (rand() - 0.5) * 3), randIsl.colorTheme);
      }

      if (isFlying) {
        const elapsed = performance.now() - flightStart;
        const t = Math.min(1.0, elapsed / flightDuration);
        const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        camera.position.lerpVectors(camStartPos, camEndPos, ease);
        controls.target.lerpVectors(tgtStartPos, tgtEndPos, ease);
        if (t >= 1.0) isFlying = false;
      }

      controls.update();
      renderer.render(scene, camera);
      cssRenderer.render(scene, camera);
    }

    /* ========================================================
       7. 程式主入口（安全初始化）
       ======================================================== */
    function init() {
      try {
        const container = document.getElementById('webgl-canvas');
        const cssContainer = document.getElementById('css2d-container');

        renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        cssRenderer = new CSS2DRenderer();
        cssRenderer.setSize(window.innerWidth, window.innerHeight);
        cssRenderer.domElement.style.position = 'absolute';
        cssRenderer.domElement.style.top = '0';
        cssRenderer.domElement.style.left = '0';
        cssRenderer.domElement.style.pointerEvents = 'none';
        cssContainer.appendChild(cssRenderer.domElement);

        scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0xf4eee3, 42, 150);

        camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.3, 360);
        const dist = window.innerWidth < 800 ? 52 : 36;
        camera.position.set(0.24 * dist, 0.33 * dist, 0.87 * dist);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.07;
        controls.enablePan = false;
        controls.minPolarAngle = THREE.MathUtils.degToRad(25);
        controls.maxPolarAngle = THREE.MathUtils.degToRad(70);
        controls.minDistance = 6;
        controls.maxDistance = 75;

        initEnvironment();
        initIslands();
        initBuildings();
        initCollaborations();
        initListeners();

        setDayTime(1260);

        setTimeout(() => {
          document.getElementById('loading-screen').classList.add('hidden');
          triggerFirework(new THREE.Vector3(0, 6, 0), '#ff5533');
        }, 500);

        requestAnimationFrame(animate);

      } catch (err) {
        console.error("Init Error:", err);
        document.getElementById('loading-status').innerHTML = `<span style="color:#d9534f;font-weight:bold;">載入異常：${err.message}</span>`;
      }
    }

    init();
  </script>
