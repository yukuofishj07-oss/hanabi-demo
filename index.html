<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>花火島 HANABI ISLAND - 傳統煙火工藝與盛典</title>
  <link rel="stylesheet" href="./styles/main.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- 品牌面板 -->
  <div class="glass-panel" id="brand-card">
    <div class="eyebrow">HANABI TRADITIONAL CRAFT</div>
    <h1>示範市．花火島</h1>
    <p>走訪傳統尺玉煙火完整的 12 道製造工序：從火藥研磨、星珠滾製到夜空盛大綻放！</p>
    <div class="badge-row">
      <span class="chip">✨ 實裝璀璨發光花火</span>
      <span class="chip">👷 擬真雙足擺動工匠</span>
      <span class="chip">📜 12道真實煙火古法</span>
    </div>
  </div>

  <!-- 即時工藝物流日誌 -->
  <div class="glass-panel" id="live-log-panel">
    <div class="log-header">
      <span class="live-dot"></span>
      <span class="eyebrow" style="margin:0;">FACTORY LIVE LOG</span>
      <span id="fps-badge">60 FPS</span>
    </div>
    <div id="log-list">
      <div class="log-item">🟢 01研磨室：黑色基底火藥比例混合完成</div>
      <div class="log-item">🚚 工匠搬運：[星珠乾燥盤] 運往 06填裝室</div>
      <div class="log-item">✨ 11發射陣地：10吋錦冠尺玉已裝入發射筒</div>
    </div>
  </div>

  <!-- 底部 HUD 工具列 -->
  <div class="glass-panel" id="hud-toolbar">
    <div class="hud-group">
      <button class="hud-btn" data-time="360">🌅 清晨</button>
      <button class="hud-btn" data-time="720">☀️ 正午</button>
      <button class="hud-btn" data-time="1065">🌇 霞暮</button>
      <button class="hud-btn active" data-time="1260">🎆 施放夜</button>
    </div>
    <div class="hud-divider"></div>
    <div class="hud-group">
      <button class="hud-btn toggle-btn active" id="btn-audio">🔊 音效: 開</button>
      <button class="hud-btn toggle-btn active" id="toggle-flow">⚡ 原料流動</button>
      <button class="hud-btn toggle-btn active" id="toggle-workers">👷 工人搬運</button>
      <button class="hud-btn" id="btn-topdown">🔭 鳥瞰模式</button>
      <button class="hud-btn fire-action" id="btn-launch-firework">🎇 施放煙火</button>
      <button class="hud-btn fire-action-combo" id="btn-launch-barrage">🎆 萬彈齊發</button>
    </div>
  </div>

  <!-- 左側詳細工序資訊卡片 -->
  <div class="glass-panel" id="detail-card">
    <div class="card-close" id="card-close-btn">&times;</div>
    <div class="eyebrow" id="card-type">第 01 道工序</div>
    <h2 id="card-title">點選島嶼查看作業流程</h2>
    <div id="card-desc">在微縮地圖中選擇六角工坊，查看真實製造細節與檢驗數據。</div>
    <div class="stats-grid" id="card-stats"></div>
    <button class="card-action-btn" id="card-fire-btn">🚀 在此工島上空施放試驗彈</button>
  </div>

  <!-- 啟動覆蓋層 -->
  <div id="loading-overlay">
    <div class="loader-content">
      <div class="loader-spinner"></div>
      <h2>花火工藝微縮世界組裝中...</h2>
      <p>點擊按鈕開啟 3D 黏土微縮工藝島與花火夜空</p>
      <button id="btn-start" class="start-btn">進入花火島世界</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
